name: Validate Streamlit app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: python -m compileall -q app.py drive_sync.py data_model.py catalog.py unified_budget.py calendar_model.py route_preview.py attractions_model.py attractions_ui.py city_compare.py city_research.py city_market.py city_research_round2.py itinerary_planner.py finance_lifestyle.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
