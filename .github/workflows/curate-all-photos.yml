name: Curate remaining European destination photos
on:
  push:
    branches:
      - feature/ux-all-destination-local-photos
    paths:
      - .github/workflows/curate-all-photos.yml
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Curate only missing images with validated Commons metadata
        run: PYTHONPATH=. python scripts/curate_missing_destination_photos.py
      - name: Commit images and manifest to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/destinations/ data/destination_photo_assets.json docs/UX_ALL_DESTINATION_PHOTOS_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "Bundle licensed WebP assets for missing European cities"
            git push origin HEAD:refs/heads/feature/ux-all-destination-local-photos
          fi
