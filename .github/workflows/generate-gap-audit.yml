name: Generate rail and attraction gap audit (one-time)
on:
  push:
    branches:
      - audit/rail-attraction-coverage-2026-11
    paths:
      - .github/workflows/generate-gap-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: pip install -r requirements.txt
      - name: Run read-only canonical model audit
        run: PYTHONPATH=. python scripts/audit_rail_and_attraction_gaps.py
      - name: Commit generated documentation in this audit branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/2026-11-17-rail-attraction-gaps/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 1380 route and 2820 attraction access gap records"
            git push origin HEAD:refs/heads/audit/rail-attraction-coverage-2026-11
          fi
