name: Probe destination photo inventory and Wikimedia
on:
  push:
    branches: [feature/ux-all-destination-local-photos]
    paths:
      - .github/workflows/probe-all-photos.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Audit all destinations and probe Wikimedia endpoints
        run: PYTHONPATH=. python scripts/probe_all_destination_photos.py
