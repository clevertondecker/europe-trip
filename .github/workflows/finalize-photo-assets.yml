name: Finalize 46 destination photos
on:
  push:
    branches: [feature/ux-all-destination-local-photos]
    paths:
      - .github/workflows/finalize-photo-assets.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify Commons licenses and bundle the two curated exceptions
        run: PYTHONPATH=. python scripts/finalize_destination_photo_assets.py
      - name: Commit audited photo manifest, assets and complete coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/destinations/ data/destination_photo_assets.json docs/UX_ALL_DESTINATION_PHOTOS_COVERAGE.json
          if ! git diff --cached --quiet; then
            git commit -m "Finalize all 46 destination images with licensed local photos"
            git push origin HEAD:refs/heads/feature/ux-all-destination-local-photos
          fi
