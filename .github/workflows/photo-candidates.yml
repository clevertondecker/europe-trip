name: One-time Commons photo quality candidates
on:
  push:
    branches: [feature/ux-all-destination-local-photos]
    paths:
      - .github/workflows/photo-candidates.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/probe_missing_photo_candidates.py
